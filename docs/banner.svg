<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="50%" stop-color="#f1f8e9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="greenBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d98b"/>
      <stop offset="100%" stop-color="#95ec69"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative dots -->
  <g fill="#c8e6c9" opacity="0.5">
    <circle cx="60" cy="80" r="3"/><circle cx="90" cy="60" r="2"/><circle cx="120" cy="90" r="2.5"/>
    <circle cx="1100" cy="540" r="3"/><circle cx="1130" cy="560" r="2"/><circle cx="1070" cy="570" r="2.5"/>
    <circle cx="1140" cy="100" r="2"/><circle cx="1110" cy="120" r="2.5"/><circle cx="80" cy="560" r="2.5"/>
  </g>

  <!-- Title area -->
  <text x="600" y="130" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="52" font-weight="bold" fill="#2e7d32">Jev 微信聊天意图分析</text>
  <text x="600" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" fill="#558b2f">AI 驱动 · 读懂对方的真实意图</text>

  <!-- Chat bubbles area -->
  <g filter="url(#shadow)">
    <!-- Self bubble (green, right) -->
    <path d="M 780 230 Q 780 210 800 210 L 920 210 Q 940 210 940 230 L 940 280 Q 940 300 920 300 L 820 300 L 800 318 L 800 300 L 800 290 Q 780 290 780 280 Z" fill="url(#greenBubble)"/>
    <text x="860" y="252" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" fill="#1b5e20">你晚上有空吗？</text>
    <text x="860" y="278" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#2e7d32">想约你吃饭~</text>

    <!-- Other bubble (white, left) -->
    <path d="M 280 340 Q 280 320 300 320 L 440 320 Q 460 320 460 340 L 460 400 Q 460 420 440 420 L 320 420 L 300 438 L 300 420 L 300 410 Q 280 410 280 400 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="370" y="358" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" fill="#333">应该有吧</text>
    <text x="370" y="384" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#666">怎么了？</text>
  </g>

  <!-- Analysis card -->
  <g filter="url(#softShadow)">
    <rect x="300" y="460" width="600" height="130" rx="12" fill="#ffffff" stroke="#e8f5e9" stroke-width="2"/>
    <!-- Header -->
    <rect x="300" y="460" width="600" height="36" rx="12" fill="#e8f5e9"/>
    <text x="320" y="484" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">🔍 AI 意图分析</text>
    <!-- Tags -->
    <g font-family="'Microsoft YaHei',sans-serif" font-size="13">
      <rect x="320" y="510" width="80" height="28" rx="14" fill="#e3f2fd"/>
      <text x="360" y="529" text-anchor="middle" fill="#1565c0">意图: 邀约</text>
      <rect x="412" y="510" width="80" height="28" rx="14" fill="#fff3e0"/>
      <text x="452" y="529" text-anchor="middle" fill="#e65100">动机: 亲近</text>
      <rect x="504" y="510" width="90" height="28" rx="14" fill="#f3e5f5"/>
      <text x="549" y="529" text-anchor="middle" fill="#6a1b9a">关系: 暧昧</text>
      <rect x="606" y="510" width="100" height="28" rx="14" fill="#e8f5e9"/>
      <text x="656" y="529" text-anchor="middle" fill="#2e7d32">方向: 升温</text>
    </g>
    <!-- Score bars -->
    <text x="320" y="568" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#888">关系热度</text>
    <rect x="380" y="558" width="200" height="14" rx="7" fill="#f0f0f0"/>
    <rect x="380" y="558" width="150" height="14" rx="7" fill="#95ec69"/>
    <text x="590" y="569" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#666">75%</text>
    <text x="640" y="568" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#888">回复建议</text>
    <rect x="700" y="558" width="180" height="14" rx="7" fill="#f0f0f0"/>
    <rect x="700" y="558" width="120" height="14" rx="7" fill="#42a5f5"/>
    <text x="890" y="569" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#666">主动回应</text>
  </g>

  <!-- Arrow connecting bubble to analysis -->
  <path d="M 370 440 L 370 458" stroke="#a5d98b" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <path d="M 365 453 L 370 460 L 375 453" stroke="#a5d98b" stroke-width="2" fill="none"/>

  <!-- Footer -->
  <text x="600" y="615" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#9e9e9e">Vue 3 · FastAPI · TypeSafe Jev · DeepSeek</text>
</svg>
