<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="uiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="greenB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d98b"/>
      <stop offset="100%" stop-color="#95ec69"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Window background -->
  <rect width="1200" height="700" fill="url(#uiBg)"/>

  <!-- Browser top bar -->
  <rect width="1200" height="40" fill="#e0e0e0"/>
  <circle cx="22" cy="20" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="7" fill="#febc2e"/>
  <circle cx="66" cy="20" r="7" fill="#28c840"/>
  <rect x="120" y="10" width="400" height="20" rx="10" fill="#fff"/>
  <text x="130" y="25" font-family="sans-serif" font-size="11" fill="#999">localhost:5173</text>
  <text x="900" y="26" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#555">Jev 聊天分析</text>

  <!-- Left panel (chat) -->
  <rect x="20" y="60" width="560" height="620" rx="8" fill="#ededed"/>
  <rect x="20" y="60" width="560" height="44" rx="8" fill="#f7f7f7"/>
  <rect x="20" y="92" width="560" height="12" fill="#f7f7f7"/>
  <text x="40" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#333">聊天记录</text>

  <!-- Self bubble (green, right) -->
  <g>
    <path d="M 400 130 Q 400 112 418 112 L 540 112 Q 558 112 558 130 L 558 168 Q 558 186 540 186 L 438 186 L 418 202 L 418 186 L 418 176 Q 400 176 400 168 Z" fill="url(#greenB)"/>
    <text x="479" y="140" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#1b5e20">在吗？</text>
    <text x="479" y="162" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#1b5e20">晚上有空一起吃饭吗</text>
  </g>

  <!-- Other (white, left) -->
  <g>
    <path d="M 60 220 Q 60 202 78 202 L 320 202 Q 338 202 338 220 L 338 258 Q 338 276 320 276 L 100 276 L 80 292 L 80 276 L 80 266 Q 60 266 60 258 Z" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="199" y="230" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#333">有空呀</text>
    <text x="199" y="252" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#333">你想去哪吃？</text>
  </g>

  <!-- Analysis card below other bubble -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="300" width="400" height="140" rx="8" fill="#fff" stroke="#e8f5e9" stroke-width="1.5"/>
    <rect x="60" y="300" width="400" height="28" rx="8" fill="#e8f5e9"/>
    <text x="76" y="319" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">AI 分析结果</text>
    <g font-family="'Microsoft YaHei',sans-serif" font-size="11">
      <rect x="76" y="340" width="70" height="22" rx="11" fill="#e3f2fd"/>
      <text x="111" y="355" text-anchor="middle" fill="#1565c0">意图: 邀约</text>
      <rect x="154" y="340" width="70" height="22" rx="11" fill="#fff3e0"/>
      <text x="189" y="355" text-anchor="middle" fill="#e65100">动机: 亲近</text>
      <rect x="232" y="340" width="80" height="22" rx="11" fill="#f3e5f5"/>
      <text x="272" y="355" text-anchor="middle" fill="#6a1b9a">关系: 暧昧</text>
      <rect x="320" y="340" width="70" height="22" rx="11" fill="#e8f5e9"/>
      <text x="355" y="355" text-anchor="middle" fill="#2e7d32">方向: 升温</text>
    </g>
    <text x="76" y="388" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#888">关系热度</text>
    <rect x="130" y="380" width="180" height="12" rx="6" fill="#f0f0f0"/>
    <rect x="130" y="380" width="135" height="12" rx="6" fill="#95ec69"/>
    <text x="318" y="390" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#666">75%</text>
    <text x="76" y="416" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#888">回复建议</text>
    <rect x="130" y="406" width="200" height="12" rx="6" fill="#f0f0f0"/>
    <rect x="130" y="406" width="150" height="12" rx="6" fill="#42a5f5"/>
    <text x="338" y="416" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#666">积极回应</text>
    <text x="76" y="432" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#42a5f5">"好呀，你定地方~"</text>
  </g>

  <!-- Self bubble 2 -->
  <g>
    <path d="M 400 470 Q 400 452 418 452 L 545 452 Q 563 452 563 470 L 563 492 Q 563 510 545 510 L 438 510 L 418 526 L 418 510 L 418 500 Q 400 500 400 492 Z" fill="url(#greenB)"/>
    <text x="482" y="482" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#1b5e20">那去新开的那家日料？</text>
  </g>

  <!-- Other bubble 2 -->
  <g>
    <path d="M 60 550 Q 60 532 78 532 L 280 532 Q 298 532 298 550 L 298 572 Q 298 590 280 590 L 100 590 L 80 606 L 80 590 L 80 580 Q 60 580 60 572 Z" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="179" y="562" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#333">可以呀，听你的~</text>
  </g>

  <!-- Right panel (input + dashboard) -->
  <rect x="600" y="60" width="580" height="620" rx="8" fill="#fff"/>
  <rect x="600" y="60" width="580" height="44" rx="8" fill="#f7f7f7"/>
  <rect x="600" y="92" width="580" height="12" fill="#f7f7f7"/>
  <text x="620" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#333">输入 &amp; 分析面板</text>

  <!-- Textarea -->
  <text x="620" y="125" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#666">粘贴聊天记录：</text>
  <rect x="620" y="135" width="540" height="160" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="632" y="158" font-family="'Consolas',monospace" font-size="11" fill="#555">A：你晚上有空吗？</text>
  <text x="632" y="178" font-family="'Consolas',monospace" font-size="11" fill="#555">B：应该有吧，怎么了？</text>
  <text x="632" y="198" font-family="'Consolas',monospace" font-size="11" fill="#555">A：没什么，就问问。</text>
  <text x="632" y="218" font-family="'Consolas',monospace" font-size="11" fill="#555">B：哦哦。</text>
  <text x="632" y="238" font-family="'Consolas',monospace" font-size="11" fill="#555">A：那算了，你忙吧。</text>
  <text x="632" y="278" font-family="'Consolas',monospace" font-size="11" fill="#999">（支持中英文冒号分隔）</text>

  <!-- Sender select -->
  <text x="620" y="320" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#666">选择"对方"发送者：</text>
  <rect x="620" y="330" width="200" height="32" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="636" y="351" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#333">B（对方）</text>
  <polygon points="800,340 810,340 805,348" fill="#999"/>

  <!-- Buttons -->
  <rect x="620" y="380" width="100" height="36" rx="6" fill="#fff" stroke="#07c160" stroke-width="1.5"/>
  <text x="670" y="403" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#07c160">解析</text>
  <rect x="734" y="380" width="140" height="36" rx="6" fill="#07c160"/>
  <text x="804" y="403" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#fff">分析对方消息</text>

  <!-- Dashboard card -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="440" width="540" height="220" rx="8" fill="#fafafa" stroke="#e8f5e9" stroke-width="1.5"/>
    <rect x="620" y="440" width="540" height="32" rx="8" fill="#e8f5e9"/>
    <text x="636" y="461" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">会话级 Dashboard</text>

    <!-- Overall direction -->
    <text x="640" y="500" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#666">整体方向</text>
    <rect x="710" y="488" width="90" height="24" rx="12" fill="#e8f5e9"/>
    <text x="755" y="504" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">升温中</text>

    <text x="830" y="500" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#666">主导动机</text>
    <rect x="900" y="488" width="90" height="24" rx="12" fill="#fff3e0"/>
    <text x="945" y="504" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="bold" fill="#e65100">亲近</text>

    <!-- Score bars -->
    <g font-family="'Microsoft YaHei',sans-serif" font-size="11">
      <text x="640" y="535" fill="#666">主动性</text>
      <rect x="700" y="526" width="200" height="12" rx="6" fill="#f0f0f0"/>
      <rect x="700" y="526" width="160" height="12" rx="6" fill="#95ec69"/>
      <text x="908" y="536" fill="#888">80%</text>

      <text x="640" y="560" fill="#666">亲密度</text>
      <rect x="700" y="551" width="200" height="12" rx="6" fill="#f0f0f0"/>
      <rect x="700" y="551" width="130" height="12" rx="6" fill="#95ec69"/>
      <text x="908" y="561" fill="#888">65%</text>

      <text x="640" y="585" fill="#666">暧昧度</text>
      <rect x="700" y="576" width="200" height="12" rx="6" fill="#f0f0f0"/>
      <rect x="700" y="576" width="110" height="12" rx="6" fill="#95ec69"/>
      <text x="908" y="586" fill="#888">55%</text>
    </g>

    <!-- Reply strategy -->
    <rect x="640" y="608" width="500" height="40" rx="6" fill="#e3f2fd"/>
    <text x="656" y="625" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#1565c0">策略：对方兴趣明显，建议顺势推进，可主动提出具体安排。</text>
    <text x="656" y="642" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#1976d2">回复：「好呀，那我订位置啦~」</text>
  </g>
</svg>
